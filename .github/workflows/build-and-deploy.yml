name: Build and Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  publish-image:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    concurrency:
      group: pitaka-web-sha-${{ github.event.workflow_run.head_sha }}
      queue: max
    env:
      IMAGE: jimbodev0530/pitaka-web
      SOURCE_REVISION: ${{ github.event.workflow_run.head_sha }}
      CI_RUN_ID: ${{ github.event.workflow_run.id }}
      CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
    outputs:
      bundle_sha256: ${{ steps.artifact.outputs.archive_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve the artifact from this exact successful CI run
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: pitaka-web-${{ github.event.workflow_run.head_sha }}-run-${{ github.event.workflow_run.id }}-attempt-${{ github.event.workflow_run.run_attempt }}
        shell: bash
        run: |
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}")"
          jq -e --arg sha "$SOURCE_REVISION" --argjson attempt "$CI_RUN_ATTEMPT" \
            '.head_sha == $sha and .head_branch == "main" and .event == "push" and .status == "completed" and .conclusion == "success" and .run_attempt == $attempt' \
            <<< "$run_json" >/dev/null

          artifacts_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}/artifacts?per_page=100")"
          artifact_ids="$(jq -c --arg name "$ARTIFACT_NAME" '[.artifacts[] | select(.name == $name and .expired == false) | .id]' <<< "$artifacts_json")"
          artifact_count="$(jq 'length' <<< "$artifact_ids")"
          if [[ "$artifact_count" != '1' ]]; then
            matching="$(jq -c --arg name "$ARTIFACT_NAME" '[.artifacts[] | select(.name == $name) | {id, expired, expires_at}]' <<< "$artifacts_json")"
            if [[ "$matching" == '[]' ]]; then
              echo "No artifact named ${ARTIFACT_NAME} belongs to successful CI run ${CI_RUN_ID}." >&2
            else
              echo "Artifact ${ARTIFACT_NAME} is expired or ambiguous: ${matching}." >&2
            fi
            exit 1
          fi
          echo "artifact_id=$(jq -r '.[0]' <<< "$artifact_ids")" >> "$GITHUB_OUTPUT"

      - name: Download the resolved artifact by ID
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.resolve.outputs.artifact_id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pitaka-web-artifact

      - name: Verify the archive and extract the checked static bytes
        id: artifact
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/pitaka-web-artifact
        shell: bash
        run: |
          manifest="$(node scripts/verify-web-build-artifact.mjs "$ARTIFACT_DIRECTORY" "$SOURCE_REVISION" "$GITHUB_REPOSITORY" "$CI_RUN_ID" "$CI_RUN_ATTEMPT")"
          archive_name="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).archive.name)' "$manifest")"
          archive_sha="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).archive.sha256)' "$manifest")"
          mkdir -p web-image
          tar --extract --gzip --file "$ARTIFACT_DIRECTORY/$archive_name" --directory web-image --no-same-owner
          echo "archive_sha256=$archive_sha" >> "$GITHUB_OUTPUT"
          printf 'Verified checked bundle `%s` with SHA-256 `%s`.\n' "$archive_name" "$archive_sha" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check for an existing immutable commit tag
        id: tag
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ steps.artifact.outputs.archive_sha256 }}
        shell: bash
        run: |
          tag="sha-${SOURCE_REVISION}"
          status="$(scripts/docker-hub-manifest-status.sh "${IMAGE}:${tag}")"
          if [[ "$status" == 'present' ]]; then
            docker pull --platform linux/amd64 "${IMAGE}:${tag}"
            published_revision="$(docker image inspect "${IMAGE}:${tag}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
            published_archive_sha="$(docker image inspect "${IMAGE}:${tag}" --format '{{ index .Config.Labels "org.pitaka.web.archive.sha256" }}')"
            if [[ "$published_revision" != "$SOURCE_REVISION" ]]; then
              echo "Refusing to reuse ${IMAGE}:${tag}: its source revision is ${published_revision}." >&2
              exit 1
            fi
            if [[ "$published_archive_sha" != "$EXPECTED_ARCHIVE_SHA256" ]]; then
              echo "Refusing to reuse ${IMAGE}:${tag}: its web bundle checksum is ${published_archive_sha}." >&2
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Build and publish the immutable commit image
        if: steps.tag.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          build-args: |
            VCS_REF=${{ env.SOURCE_REVISION }}
            WEB_ARCHIVE_SHA256=${{ steps.artifact.outputs.archive_sha256 }}

  verify-image:
    needs: publish-image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      IMAGE: jimbodev0530/pitaka-web
      SOURCE_REVISION: ${{ github.event.workflow_run.head_sha }}
      BUNDLE_SHA256: ${{ needs.publish-image.outputs.bundle_sha256 }}
    outputs:
      bundle_sha256: ${{ needs.publish-image.outputs.bundle_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify the immutable image before promotion
        shell: bash
        run: scripts/verify-web-image.sh "${IMAGE}:sha-${SOURCE_REVISION}" "$SOURCE_REVISION" "$BUNDLE_SHA256"

  promote-main:
    needs: verify-image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    concurrency:
      group: pitaka-web-main
      queue: max
    env:
      IMAGE: jimbodev0530/pitaka-web
      SOURCE_REVISION: ${{ github.event.workflow_run.head_sha }}
      SOURCE_BUNDLE_SHA256: ${{ needs.verify-image.outputs.bundle_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote only a newer verified main build
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SOURCE_REVISION" origin/main; then
            echo "The successful CI commit is no longer on main; leaving the main image unchanged."
            exit 0
          fi

          status="$(scripts/docker-hub-manifest-status.sh "${IMAGE}:main")"
          if [[ "$status" == 'missing' ]]; then
            docker buildx imagetools create --tag "${IMAGE}:main" "${IMAGE}:sha-${SOURCE_REVISION}"
            exit 0
          fi

          docker pull --platform linux/amd64 "${IMAGE}:main"
          current_revision="$(docker image inspect "${IMAGE}:main" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          current_bundle_sha="$(docker image inspect "${IMAGE}:main" --format '{{ index .Config.Labels "org.pitaka.web.archive.sha256" }}')"
          if [[ -z "$current_revision" ]]; then
            echo "The current main image has no source revision label; refusing to replace it." >&2
            exit 1
          fi
          if [[ "$current_revision" == "$SOURCE_REVISION" ]]; then
            if [[ "$current_bundle_sha" != "$SOURCE_BUNDLE_SHA256" ]]; then
              echo "The main image already has this source revision with a different web bundle checksum." >&2
              exit 1
            fi
            echo 'The main image already points to this verified CI build.'
            exit 0
          fi
          if ! git cat-file -e "${current_revision}^{commit}" 2>/dev/null \
            || ! git merge-base --is-ancestor "$current_revision" "$SOURCE_REVISION"; then
            echo "The candidate $SOURCE_REVISION is not newer than the published main revision $current_revision; leaving main unchanged."
            exit 0
          fi

          docker buildx imagetools create --tag "${IMAGE}:main" "${IMAGE}:sha-${SOURCE_REVISION}"
