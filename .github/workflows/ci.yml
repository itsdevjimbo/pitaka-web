name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run check:format

      - run: npm run check:changed -- "$BASE_OPTION" "$BASE_REF"
        env:
          BASE_OPTION: ${{ github.event_name == 'pull_request' && '--base' || '--since' }}
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - run: npm run lint

      - run: npm run test:standards

      - run: npm run test:web-build

      - run: npm test
