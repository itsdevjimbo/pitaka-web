<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PROTOTYPE — Linked Contribution journeys</title>
    <style>
      :root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#171717;background:#fafafa;--accent:#6656d9;--green:#08785f;--line:#e5e5e5}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#191919;color:#bbb;padding:28px 18px}.brand{color:white;font-weight:800;font-size:21px;margin-bottom:32px}.nav{padding:10px 12px;border-radius:9px;margin:4px 0}.nav.active{background:#303030;color:white}.main{max-width:900px;width:100%;margin:auto;padding:36px 42px 110px}h1{font-size:26px;margin:0 0 6px}.muted{color:#737373}.proto{font-size:11px;letter-spacing:.12em;color:#a3a3a3;font-weight:800}.tabs,.seg{display:flex;gap:6px;margin:24px 0}.tabs button,.seg button,.ghost{border:1px solid var(--line);background:white;padding:9px 13px;border-radius:9px}.tabs .on,.seg .on{background:#242424;color:white;border-color:#242424}.list{display:grid;gap:10px}.row,.card,.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:16px}.row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:18px}.money{font-weight:750}.income{color:var(--green)}.primary{border:0;background:var(--accent);color:white;padding:10px 14px;border-radius:9px;font-weight:700}.link{border:0;background:none;color:var(--accent);font-weight:700}.dialog{max-width:560px;margin:24px auto;background:white;border:1px solid var(--line);box-shadow:0 18px 55px #0002;border-radius:18px;padding:22px}.dialog h2,.panel h2{margin:0 0 6px}.summary{background:#f5f5f5;padding:12px;border-radius:10px;margin:16px 0;display:flex;justify-content:space-between}.goal{padding:12px 0;border-bottom:1px solid var(--line)}.goal:last-child{border:0}.goal-line{display:flex;align-items:center;justify-content:space-between;gap:16px}.bar{height:7px;background:#e5e5e5;border-radius:9px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--accent)}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input[type=number]{width:130px;padding:9px;border:1px solid #ccc;border-radius:8px}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.inline{margin-top:12px;background:#f7f7ff;border-left:3px solid var(--accent);padding:15px;border-radius:0 12px 12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.choice{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}.choice.selected{border:2px solid var(--accent);background:#f8f7ff}.capacity{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.metric{background:#f5f5f5;border-radius:10px;padding:11px}.metric b{display:block;font-size:18px}.switcher{position:fixed;z-index:9;bottom:18px;left:50%;transform:translateX(-50%);background:#111;color:white;border-radius:999px;padding:8px;box-shadow:0 8px 28px #0005;display:flex;align-items:center;gap:8px}.switcher button{border:0;border-radius:999px;background:#333;color:white;width:34px;height:34px}.switcher span{min-width:210px;text-align:center;font-weight:700}.note{font-size:12px;color:#777;margin-top:8px}.hidden{display:none!important}@media(max-width:720px){.shell{display:block}.side{display:none}.main{padding:24px 16px 100px}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr auto}.row .muted{grid-row:2}.capacity{grid-template-columns:1fr}}
    </style>
  </head>
  <body>
    <!-- Three variants of both Linked Contribution entry journeys, switchable via ?variant=. PROTOTYPE: throw away. -->
    <div class="shell"><aside class="side"><div class="brand">Pitaka</div><div class="nav">Accounts</div><div class="nav active" id="navT">Transactions</div><div class="nav">Budgets</div><div class="nav" id="navG">Goals</div></aside><main class="main">
      <div class="proto">THROWAWAY INTERACTION PROTOTYPE</div><h1 id="pageTitle">Transactions</h1><p class="muted" id="pageSub">Everything you’ve recorded, across every account, newest first.</p>
      <div class="tabs"><button id="txTab" onclick="setJourney('transaction')">Start from a Transaction</button><button id="goalTab" onclick="setJourney('goal')">Start from a Goal</button></div>
      <section id="variantA"></section><section id="variantB"></section><section id="variantC"></section>
    </main></div>
    <div class="switcher"><button onclick="cycle(-1)" aria-label="Previous variant">←</button><span id="variantLabel"></span><button onclick="cycle(1)" aria-label="Next variant">→</button></div>
    <script>
      const variants=[['A','Focused dialog'],['B','Inline in context'],['C','Capacity composer']];
      let journey=new URLSearchParams(location.search).get('journey')||'transaction';
      let variant=(new URLSearchParams(location.search).get('variant')||'A').toUpperCase();
      const tx=`<div class="row"><div><b>Salary</b><div class="muted">Sep 15 · BPI Savings</div></div><span class="money income">+₱50,000</span><button class="link">Contribute to a Goal</button></div>`;
      const goals=`<div class="goal"><div class="goal-line"><b>Emergency fund</b><span>₱42,000 / ₱100,000</span></div><div class="bar"><i style="width:42%"></i></div></div><div class="goal"><div class="goal-line"><b>Japan trip</b><span>₱18,500 / ₱60,000</span></div><div class="bar"><i style="width:31%"></i></div></div>`;
      const picker=()=>journey==='transaction'?`<label>Split this income across Goals</label>${goals}<div class="goal-line"><span>Emergency fund</span><input type="number" value="12000"></div><div class="goal-line"><span>Japan trip</span><input type="number" value="8000"></div>`:`<label>Choose eligible income</label><div class="choice selected"><b>Salary · ₱50,000</b><div class="muted">Sep 15 · BPI Savings · ₱30,000 remaining</div></div><div class="choice"><b>Freelance project · ₱16,000</b><div class="muted">Sep 10 · Maya · ₱16,000 remaining</div></div><label>Amount</label><input type="number" value="20000">`;
      function a(){return `${journey==='transaction'?tx:`<div class="card"><h2>Emergency fund</h2>${goals.split('</div><div class="goal">')[0]}</div>`}<div class="dialog"><div class="proto">${journey==='transaction'?'SALARY · ₱50,000':'EMERGENCY FUND'}</div><h2>Contribute to a Goal</h2><p class="muted">${journey==='transaction'?'₱20,000 already earmarked · ₱30,000 remaining':'Choose income that can support this Contribution.'}</p>${picker()}<div class="summary"><span>This Contribution</span><b>₱20,000</b></div><div class="actions"><button class="ghost">Cancel</button><button class="primary">Contribute ₱20,000</button></div></div>`}
      function b(){return journey==='transaction'?`<div class="list">${tx}<div class="inline"><b>Salary has ₱30,000 left to contribute</b>${picker()}<div class="actions"><button class="ghost">Cancel</button><button class="primary">Contribute</button></div></div><div class="row"><div><b>Groceries</b><div class="muted">Sep 14 · Cash</div></div><span class="money">−₱2,430</span><span class="muted">Expense</span></div></div>`:`<div class="card"><div class="goal-line"><div><h2>Emergency fund</h2><span class="muted">₱42,000 of ₱100,000</span></div><button class="primary">Add contribution</button></div><div class="bar"><i style="width:42%"></i></div><div class="inline"><b>Add from income</b>${picker()}<div class="actions"><button class="ghost">Cancel</button><button class="primary">Contribute ₱20,000</button></div></div><h3>Contribution history</h3><div class="choice"><b>₱12,000 · BPI Savings</b><div class="muted">Sep 8 · ordinary Contribution</div></div></div>`}
      function c(){return `<div class="capacity"><div class="metric"><span class="muted">Income</span><b>₱50,000</b></div><div class="metric"><span class="muted">Already earmarked</span><b>₱20,000</b></div><div class="metric"><span class="muted">Available</span><b>₱30,000</b></div></div><div class="grid"><div class="panel"><h2>${journey==='transaction'?'1. Income chosen':'1. Choose income'}</h2>${tx}${journey==='goal'?picker():''}</div><div class="panel"><h2>${journey==='goal'?'2. Goal chosen':'2. Allocate to Goals'}</h2>${journey==='goal'?goals.split('</div><div class="goal">')[0]:picker()}</div></div><div class="panel" style="margin-top:16px"><div class="goal-line"><div><b>Ready to create ${journey==='transaction'?'2 Linked Contributions':'1 Linked Contribution'}</b><div class="muted">Dated today · uses the income Transaction’s Account</div></div><button class="primary">Contribute ₱20,000</button></div></div>`}
      function render(){if(!variants.some(v=>v[0]===variant))variant='A'; document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));let el=document.querySelector('#variant'+variant);el.classList.remove('hidden');el.innerHTML=variant==='A'?a():variant==='B'?b():c();document.querySelector('#variantLabel').textContent=`${variant} · ${variants.find(v=>v[0]===variant)[1]}`;document.querySelector('#txTab').className=journey==='transaction'?'on':'';document.querySelector('#goalTab').className=journey==='goal'?'on':'';document.querySelector('#pageTitle').textContent=journey==='transaction'?'Transactions':'Emergency fund';document.querySelector('#pageSub').textContent=journey==='transaction'?'Everything you’ve recorded, across every account, newest first.':'₱42,000 of ₱100,000 saved';document.querySelector('#navT').classList.toggle('active',journey==='transaction');document.querySelector('#navG').classList.toggle('active',journey==='goal')}
      function setJourney(x){journey=x;sync()} function cycle(d){let i=variants.findIndex(v=>v[0]===variant);variant=variants[(i+d+variants.length)%variants.length][0];sync()} function sync(){history.replaceState({},'',`?variant=${variant}&journey=${journey}`);render()}
      addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});render();
    </script>
  </body>
</html>
