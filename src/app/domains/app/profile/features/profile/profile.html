<main class="mx-auto flex w-full max-w-5xl flex-auto flex-col gap-6 p-4 pb-28 sm:p-8">
  <header>
    <p class="text-sm font-semibold text-primary-700 dark:text-primary-200">Your details</p>
    <h1 class="mt-1 font-display text-3xl font-bold tracking-tight text-text">Profile</h1>
    <p class="mt-2 text-secondary">Manage the identity and sign-in details for your Profile.</p>
  </header>
  @if (emailChangeConfirmed) {
    <p
      class="rounded-2xl bg-success-container p-4 text-sm font-medium text-success"
      role="status"
    >
      Email address changed
    </p>
  }

  @if (profile(); as person) {
    <div class="grid min-w-0 items-start gap-5 min-[900px]:grid-cols-[minmax(15rem,0.9fr)_minmax(0,1.6fr)]">
      <profile-identity class="min-w-0" />

      <div class="grid min-w-0 gap-5">
        <profile-email class="min-w-0" />

        <profile-password class="min-w-0" />
      </div>
    </div>
  }
</main>
