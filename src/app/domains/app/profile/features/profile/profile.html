<main class="mx-auto w-full max-w-5xl p-4 pb-28 sm:p-8 sm:pb-28">
  <header class="mb-6">
    <h1 class="text-2xl font-bold tracking-tight">Profile</h1>
    <p class="mt-1 text-neutral-500 dark:text-neutral-400">
      Your identity and sign-in details.
    </p>
  </header>

  @if (profile(); as person) {
    <div class="grid items-start gap-6 lg:grid-cols-[18rem_1fr]">
      <profile-identity />

      <div class="flex flex-col gap-4">
        <profile-email />

        <section
          class="rounded-2xl border border-neutral-200 p-5 dark:border-neutral-800"
        >
          <div class="grid gap-5 sm:grid-cols-[1fr_15rem] sm:items-start">
            <div>
              <h2 class="font-semibold">Password</h2>
              <p class="mt-1 text-sm text-neutral-500 dark:text-neutral-400">
                Changing it requires your current password.
              </p>
            </div>
            <button
              matButton="outlined"
              type="button"
            >
              Change password
            </button>
          </div>
        </section>
      </div>
    </div>
  }
</main>
