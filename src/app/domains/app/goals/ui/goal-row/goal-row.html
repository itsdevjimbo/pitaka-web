<article
  class="flex min-w-0 flex-col gap-4 p-5 sm:p-6"
  [class.opacity-70]="goal().status === 'Abandoned'"
>
  <div class="min-w-0">
    <div class="flex items-start gap-3">
      <a
        class="min-w-0 flex-auto rounded-sm font-semibold break-words text-text underline-offset-4 hover:underline"
        [routerLink]="['/app/goals', goal().id]"
      >
        {{ goal().name }}
      </a>
      <button
        matIconButton
        type="button"
        class="shrink-0"
        [attr.aria-label]="'Actions for ' + goal().name"
        [matMenuTriggerFor]="menu"
      >
        <mat-icon svgIcon="ellipsis-vertical" />
      </button>
      <mat-menu #menu>
        <button
          mat-menu-item
          (click)="edit.emit(goal())"
        >
          <mat-icon svgIcon="pencil" />
          <span>Edit</span>
        </button>
        @if (goal().status === 'Active') {
          @if (goal().currentAmount >= goal().targetAmount) {
            <button
              mat-menu-item
              [disabled]="unavailable()"
              (click)="status.emit({ goal: goal(), status: 'Completed' })"
            >
              <mat-icon svgIcon="circle-check" />
              <span>Mark complete</span>
            </button>
          }
          <button
            mat-menu-item
            (click)="abandon.emit(goal())"
          >
            <mat-icon svgIcon="archive" />
            <span>Abandon</span>
          </button>
        } @else {
          <button
            mat-menu-item
            (click)="status.emit({ goal: goal(), status: 'Active' })"
          >
            <mat-icon svgIcon="circle-check" />
            <span>Mark active</span>
          </button>
        }
        <button
          mat-menu-item
          (click)="remove.emit(goal())"
        >
          <mat-icon svgIcon="trash-2" />
          <span>Delete</span>
        </button>
      </mat-menu>
    </div>
    <p class="mt-3 text-sm text-secondary">{{ goal().status }}</p>
  </div>
  <goals-goal-progress [goal]="goal()" />
</article>
