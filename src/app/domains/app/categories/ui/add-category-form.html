<form
  class="flex flex-col gap-y-4"
  (submit)="save($event)"
>
  @if (errorMessage(); as message) {
    <div
      class="rounded-lg bg-red-50 px-4 py-3 text-sm font-medium text-red-800 dark:bg-red-950 dark:text-red-200"
      role="alert"
    >
      {{ message }}
    </div>
  }

  <mat-form-field class="w-full">
    <mat-label>Name</mat-label>
    <input
      id="add-category-name"
      matInput
      [formField]="addForm.name"
    />
    <mat-error>
      @if (addForm.name().touched() && addForm.name().invalid()) {
        @for (error of addForm.name().errors(); track error) {
          {{ error.message }}
        }
      }
    </mat-error>
  </mat-form-field>

  <div class="mt-2 flex items-center justify-end gap-x-3">
    <button
      matButton
      type="button"
      (click)="cancel()"
    >
      Cancel
    </button>
    <button
      matButton="filled"
      type="submit"
      [disabled]="addForm().invalid() || submitting()"
    >
      {{ submitting() ? 'Adding…' : 'Add category' }}
    </button>
  </div>
</form>
