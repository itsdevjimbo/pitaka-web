@if (scope() === 'all') {
  <section
    class="flex flex-col items-center gap-3 rounded-[1.5rem_1.5rem_3.5rem_1.5rem] bg-soft px-6 py-14 text-center"
  >
    <mat-icon
      class="size-10 text-primary-600 dark:text-primary-200"
      svgIcon="calendar-clock"
    />
    <p class="font-display text-xl">Make regular money moments automatic</p>
    <p class="max-w-sm text-secondary">No Schedules yet. Create one to generate regular income or expenses.</p>
    <button
      matButton="filled"
      class="mt-2"
      [disabled]="createDisabled()"
      (click)="create.emit()"
    >
      <mat-icon svgIcon="plus" />
      Create Schedule
    </button>
  </section>
} @else {
  <div class="rounded-2xl border border-divider bg-surface px-6 py-14 text-center">
    <p class="font-display text-lg">{{ viewMessage() }}</p>
  </div>
}
