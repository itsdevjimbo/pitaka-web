<nav
  class="flex gap-2 overflow-x-auto lg:flex-col"
  aria-label="Schedule lifecycle"
>
  @for (option of views; track option.id) {
    <button
      matButton
      class="flex min-w-32 items-center justify-between gap-4 rounded-xl px-4 py-3 text-left"
      [attr.aria-pressed]="view() === option.id"
      [class.bg-neutral-100]="view() === option.id"
      [class.dark:bg-neutral-900]="view() === option.id"
      (click)="view.set(option.id)"
    >
      <span
        class="mr-4"
        [matBadge]="counts()[option.id]"
        matBadgeOverlap="false"
      >
        {{ option.label }}
        <span class="sr-only">{{ counts()[option.id] }}</span>
      </span>
    </button>
  }
</nav>
