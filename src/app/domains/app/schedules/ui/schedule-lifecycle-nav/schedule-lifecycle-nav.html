<nav
  class="flex w-fit max-w-full flex-wrap gap-1 rounded-xl bg-surface p-1"
  aria-label="Schedule lifecycle"
>
  @for (option of views; track option.id) {
    <button
      matButton
      class="flex min-w-28 items-center justify-center rounded-xl px-4 py-3"
      [attr.aria-pressed]="view() === option.id"
      [class.bg-soft]="view() === option.id"
      [class.text-text]="view() === option.id"
      (click)="view.set(option.id)"
    >
      {{ option.label }}
    </button>
  }
</nav>
