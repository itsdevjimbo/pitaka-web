<app-dialog-shell [heading]="heading">
  <p class="text-sm text-secondary">{{ action.explanation }}</p>

  @if (errorMessage(); as error) {
    <p
      class="mt-4 rounded-2xl bg-danger-container px-3 py-2 text-sm text-danger"
      role="alert"
    >
      {{ error }}
    </p>
  }

  <div class="mt-6 flex justify-end gap-2">
    <button
      #cancelButton
      matButton
      type="button"
      [disabled]="submitting()"
      (click)="dialogRef.close()"
    >
      Cancel
    </button>
    <button
      matButton="filled"
      type="button"
      [disabled]="submitting() || outcomeUncertain()"
      (click)="confirm()"
    >
      {{ submitting() ? action.pendingLabel : action.verb }}
    </button>
  </div>
</app-dialog-shell>
