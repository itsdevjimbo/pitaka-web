<div class="flex flex-col items-start">
  <!-- The one action, quiet while in flight and through the cooldown -->
  <button
    type="button"
    matButton="filled"
    class="min-h-11 w-full justify-center"
    [disabled]="quiet()"
    [attr.aria-busy]="sending()"
    (click)="resend()"
  >
    @if (sending()) {
      Sending…
    } @else if (remaining() > 0) {
      Resend in {{ remaining() }}s
    } @else {
      Resend confirmation email
    }
  </button>

  @if (sending()) {
    <p
      class="sr-only"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    >
      Sending a new confirmation link…
    </p>
  }

  <!-- The same line whatever came back (ADR 0015) -->
  @if (hasAsked()) {
    <p
      class="mt-2 text-sm leading-6 text-secondary"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    >
      {{ reassurance }}
    </p>
  }
</div>
