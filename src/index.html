<!doctype html>
<html
  id="pitaka"
  lang="en"
>
  <head>
    <base href="/" />
    <title>Pitaka</title>

    <!-- Meta -->
    <meta charset="utf-8" />
    <meta
      name="description"
      content="Pitaka expense tracker"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="favicon.svg"
    />

    <!-- Preload fonts -->
    <link
      rel="preload"
      href="/fonts/identity/outfit.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/geist/Geist.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/geist/Geist-Italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/geist/GeistMono.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/geist/GeistMono-Italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <!-- prettier-ignore -->
    <script>
      !function(){const e=document.documentElement.classList;let c="system";try{const s=localStorage.getItem("scheme");if(s==="system"||s==="light"||s==="dark")c=s}catch{}let t=!1;try{t=window.matchMedia("(prefers-color-scheme: dark)").matches}catch{}e.remove("scheme-dark","scheme-light");e.add(c==="dark"||c==="system"&&t?"scheme-dark":"scheme-light")}();
    </script>

    <app-root></app-root>
  </body>
</html>
